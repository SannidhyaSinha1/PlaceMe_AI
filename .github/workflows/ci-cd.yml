name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend smoke test (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r fastapi_app/requirements-core.txt
      - name: Import app & smoke-test routes
        working-directory: backend
        run: |
          python -c "from fastapi_app.main import app; assert any(r.path=='/health' for r in app.routes); print('FastAPI OK —', len(app.routes), 'routes')"
      - name: Eligibility engine sanity
        working-directory: backend
        run: |
          python -c "from fastapi_app.services.eligibility_engine import check_eligibility as c; print(c({'cgpa':9,'branch':'CSE','current_year':3,'tenth_pct':90,'twelfth_pct':90,'skills':['python']}, {'min_cgpa':7,'required_skills':['python']}))"

  django:
    name: Admin portal check (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & check
        working-directory: backend/admin_portal
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check

  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm install
          npm run build

  # ── Deploy on push to main (uses Render deploy hooks + Vercel token) ────
  deploy:
    name: Deploy
    needs: [backend, django, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploys
        run: |
          [ -n "${{ secrets.RENDER_FASTAPI_DEPLOY_HOOK }}" ] && curl -fsS "${{ secrets.RENDER_FASTAPI_DEPLOY_HOOK }}" || echo "no fastapi hook set"
          [ -n "${{ secrets.RENDER_ADMIN_DEPLOY_HOOK }}" ] && curl -fsS "${{ secrets.RENDER_ADMIN_DEPLOY_HOOK }}" || echo "no admin hook set"
      - name: Deploy frontend to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel
          cd frontend
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
