name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend smoke test (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r fastapi_app/requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check fastapi_app ai_agents tests
      - name: Import app & smoke-test routes
        working-directory: backend
        run: |
          python -c "from fastapi_app.main import app; assert any(r.path=='/health' for r in app.routes); print('FastAPI OK —', len(app.routes), 'routes')"
      - name: Run test suite
        working-directory: backend
        run: pytest tests -q

  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, test & build
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm test
          npm run build

  # ── Deploy on push to main (uses Render deploy hook + Vercel token) ────
  deploy:
    name: Deploy
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy
        run: |
          [ -n "${{ secrets.RENDER_FASTAPI_DEPLOY_HOOK }}" ] && curl -fsS "${{ secrets.RENDER_FASTAPI_DEPLOY_HOOK }}" || echo "no fastapi hook set"
      - name: Deploy frontend to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel
          cd frontend
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
