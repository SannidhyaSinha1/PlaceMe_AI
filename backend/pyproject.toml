[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "ASYNC",  # blocking calls in async functions
]
ignore = [
    "E501",  # line length — advisory only in this codebase
    "B008",  # function call in default arg — FastAPI's Depends() idiom
]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_app", "ai_agents", "analytics", "ml_models"]
