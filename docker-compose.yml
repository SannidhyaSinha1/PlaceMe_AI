# Local development stack. Production uses Render (backend) + Vercel (frontend);
# see render.yaml. Override secrets via a local .env at the repo root.
services:
  fastapi:
    build:
      context: ./backend
      dockerfile: fastapi_app/Dockerfile
    ports: ["8000:8000"]
    env_file: .env

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [fastapi]
