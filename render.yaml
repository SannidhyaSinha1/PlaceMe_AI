# Render deploy (free tier). Frontend goes to Vercel (see frontend/vercel.json).
# Create an env group "placementor-env" in the Render dashboard holding all the
# keys from .env.example, then deploy.
services:
  - type: web
    name: placementor-fastapi
    runtime: python
    rootDir: backend
    buildCommand: pip install -r fastapi_app/requirements.txt
    startCommand: uvicorn fastapi_app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: placementor-env
      - key: PYTHON_VERSION
        value: "3.12.7"
